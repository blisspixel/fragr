[package]
name = "localexception-audiogen"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Developer-only sound effect and music generation for Local Exception through the ElevenLabs API"
publish = false

[lib]
name = "localexception_audiogen"
path = "src/lib.rs"

[[bin]]
name = "localexception-audiogen"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
reqwest = { version = "0.13", features = ["blocking", "json", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true

[build-dependencies]
localexception-build-metadata = { version = "0.1.0", path = "../build-metadata" }
