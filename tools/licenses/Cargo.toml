[package]
name = "localexception-licenses"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Writes the third-party license notices shipped beside localexception-server in desktop packages"
publish = false

[lib]
name = "localexception_licenses"
path = "src/lib.rs"

[[bin]]
name = "localexception-licenses"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true

[build-dependencies]
localexception-build-metadata = { version = "0.1.0", path = "../build-metadata" }
