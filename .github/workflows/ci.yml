name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Benchmark, determinism, and budget gate
        run: cargo run -p fragr-server --release --locked -- --bench 16 --bench-ticks 1200 --bench-check --bench-assert --seed 42

      - name: Agent playtest smoke
        run: cargo run -p fragr-playtest --locked -- --agents 4 --rounds 1 --frag-limit 3 --time-limit-seconds 45 --assert --report .agents/playtest/ci.json

      - name: Check code coverage
        run: cargo llvm-cov --workspace --locked --fail-under-lines 90

      - name: Build release
        run: cargo build --workspace --release --locked

  portability:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            asset: Godot_v4.7.2-stable_win64.exe.zip
            binary: Godot_v4.7.2-stable_win64_console.exe
          - os: macos-26
            asset: Godot_v4.7.2-stable_macos.universal.zip
            binary: Godot.app/Contents/MacOS/Godot
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Workspace tests
        run: cargo test --workspace --locked
      - name: Download Godot 4.7.2-stable
        shell: pwsh
        env:
          GODOT_ASSET: ${{ matrix.asset }}
        run: |
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/4.7.2-stable/$env:GODOT_ASSET" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot-bin
      - name: Headless client checks
        shell: bash
        env:
          GODOT_BINARY: ${{ matrix.binary }}
        run: |
          export GODOT_BIN="$PWD/godot-bin/$GODOT_BINARY"
          chmod +x "$GODOT_BIN"
          bash tools/godot_check.sh
          bash tools/test_godot_check.sh

  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Check licenses, bans, and sources
        run: cargo deny check licenses bans sources

      - name: Check advisories
        # New advisories appear without a code change; report them without blocking merges.
        continue-on-error: true
        run: cargo deny check advisories

  godot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Godot 4.7.2-stable
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          echo "GODOT_BIN=$PWD/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Headless client checks
        run: bash tools/godot_check.sh

      - name: Verify client check failure detection
        run: bash tools/test_godot_check.sh
