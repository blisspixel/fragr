name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  terraform:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.4
      - name: Check plan-only container host
        run: |
          terraform fmt -check
          terraform init -backend=false -lockfile=readonly -input=false
          terraform validate
          terraform test

  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Benchmark, determinism, and budget gate
        run: cargo run -p fragr-server --release --locked -- --bench 16 --bench-ticks 1200 --bench-check --bench-assert --seed 42

      - name: Agent playtest smoke
        run: cargo run -p fragr-playtest --locked -- --agents 4 --rounds 1 --frag-limit 3 --time-limit-seconds 45 --assert --report .agents/playtest/ci.json

      - name: Team deathmatch and mutator playtests
        run: |
          cargo run -p fragr-playtest --locked -- --agents 4 --rounds 1 --mode tdm --frag-limit 6 --time-limit-seconds 60 --assert --report .agents/playtest/ci-tdm.json
          cargo run -p fragr-playtest --locked -- --agents 4 --rounds 1 --mutator rail-only --frag-limit 3 --time-limit-seconds 45 --assert --report .agents/playtest/ci-rail-only.json
          cargo run -p fragr-playtest --locked -- --agents 4 --rounds 1 --mode tdm --mutator licence-to-kill --frag-limit 6 --time-limit-seconds 60 --assert --report .agents/playtest/ci-tdm-licence.json

      - name: Sector 9 capture the flag socket proof
        run: cargo run -p fragr-playtest --locked -- --ctf-route-smoke --report .agents/playtest/ci-ctf-route.json

      - name: Sector 9 contested playtest
        run: cargo run -p fragr-playtest --locked -- --agents 4 --rounds 1 --mode ctf --map 4 --tiers reflex,planner --capture-limit 1 --time-limit-seconds 180 --max-seconds 240 --assert --ctf-contested --report .agents/playtest/ci-ctf.json

      - name: Sector 9 Sabotage socket proof
        run: cargo run -p fragr-playtest --locked -- --sabotage-route-smoke --report .agents/playtest/ci-sabotage-route.json

      - name: Sector 9 contested Sabotage playtest
        run: cargo run -p fragr-playtest --locked -- --agents 4 --rounds 1 --mode sabotage --map 4 --tiers reflex,planner --time-limit-seconds 105 --max-seconds 160 --assert --sabotage-contested --report .agents/playtest/ci-sabotage.json

      - name: Mixed-client map roster
        run: bash tools/playtest_roster.sh

      - name: Preserve playtest evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playtest-reports
          path: |
            .agents/playtest/ci.json
            .agents/playtest/ci-*.json
            .agents/playtest/roster/*.json
            .agents/playtest/roster/*.log
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

      - name: Check code coverage
        run: cargo llvm-cov --workspace --locked --fail-under-lines 90

      - name: Build release
        run: cargo build --workspace --release --locked

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build dedicated server image
        run: docker compose build server
      - name: Check runtime identity and legal notices
        run: |
          test "$(docker run --rm --entrypoint id fragr-server:local -u)" = "10001"
          docker run --rm --entrypoint sh fragr-server:local -c 'test -s /usr/share/doc/fragr/fragr-LICENSE.txt && test -s /usr/share/doc/fragr/THIRD_PARTY_LICENSES.txt'
      - name: Start and probe dedicated match
        run: |
          set -euo pipefail
          trap 'docker compose down' EXIT
          docker compose up -d --no-build
          container_id="$(docker compose ps -q server)"
          test -n "$container_id"
          for attempt in {1..45}; do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = healthy ]; then
              break
            fi
            sleep 2
          done
          if [ "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" != healthy ]; then
            docker compose ps
            docker compose logs --no-color server
            exit 1
          fi
          host_ready=false
          for attempt in {1..15}; do
            if response="$(curl --fail --silent --show-error --max-time 3 http://127.0.0.1:6767/status 2>&1)" \
              && grep -q '"kind":"arena"' <<<"$response" \
              && grep -q '"health":{"status":"ok"' <<<"$response"; then
              host_ready=true
              break
            fi
            sleep 2
          done
          if [ "$host_ready" != true ]; then
            printf 'host /status did not become ready: %s\n' "$response" >&2
            docker compose ps
            docker compose logs --no-color server
            exit 1
          fi

  portability:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            asset: Godot_v4.7.2-stable_win64.exe.zip
            binary: Godot_v4.7.2-stable_win64_console.exe
          - os: macos-26
            asset: Godot_v4.7.2-stable_macos.universal.zip
            binary: Godot.app/Contents/MacOS/Godot
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Workspace tests
        run: cargo test --workspace --locked
      - name: Build owned local server for client lifecycle checks
        run: cargo build -p fragr-server --release --locked
      - name: Download Godot 4.7.2-stable
        shell: pwsh
        env:
          GODOT_ASSET: ${{ matrix.asset }}
        run: |
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/4.7.2-stable/$env:GODOT_ASSET" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot-bin
      - name: Headless client checks
        shell: bash
        env:
          GODOT_BINARY: ${{ matrix.binary }}
        run: |
          export GODOT_BIN="$PWD/godot-bin/$GODOT_BINARY"
          chmod +x "$GODOT_BIN"
          bash tools/godot_check.sh
          bash tools/test_godot_check.sh

  soak:
    # Runs beside the test job, off its critical path. The long soak is local.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the server and the harness
        env:
          FRAGR_BUILD_COMMIT: ${{ github.sha }}
        run: cargo build -p fragr-server -p fragr-playtest --release --locked
      - name: Two minute soak
        run: target/release/fragr-playtest --soak --soak-seconds 120 --soak-sample-seconds 15 --soak-bots 4 --agents 4 --soak-spectators 2 --soak-map-rotate --assert --soak-log .agents/soak/ci.ndjson
      - name: Preserve soak evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: soak
          path: .agents/soak/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Check licenses, bans, and sources
        run: cargo deny check licenses bans sources

      - name: Check advisories
        # New advisories appear without a code change; report them without blocking merges.
        continue-on-error: true
        run: cargo deny check advisories

  godot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build owned local server for client lifecycle checks
        run: cargo build -p fragr-server --release --locked

      - name: Install Godot 4.7.2-stable
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          echo "GODOT_BIN=$PWD/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Headless client checks
        run: bash tools/godot_check.sh

      - name: Saved M01 departure and M02 retry
        run: bash tools/test_m02_carry.sh

      - name: Verify client check failure detection
        run: bash tools/test_godot_check.sh
