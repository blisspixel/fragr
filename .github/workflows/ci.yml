name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  terraform:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
      - name: Check plan-only container host
        run: |
          terraform fmt -check
          terraform init -backend=false -lockfile=readonly -input=false
          terraform validate
          terraform test

  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # This job builds the workspace four ways (clippy, tests, coverage and
      # release). Preinstalled SDKs it never uses would leave too little room.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Pin the current stable toolchain across CI and release builds.
          toolchain: 1.99.1
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@3597834a0a5e3e38f058c7b6dc454f0aa1a25609 # cargo-llvm-cov

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Benchmark, determinism, and budget gate
        run: cargo run -p localexception-server --release --locked -- --bench 16 --bench-ticks 1200 --bench-check --bench-assert --seed 42

      - name: Agent playtest smoke
        run: cargo run -p localexception-playtest --locked -- --agents 4 --rounds 1 --frag-limit 3 --time-limit-seconds 45 --assert --report .agents/playtest/ci.json

      - name: Guided campaign stress report
        # Preserve non-clears as diagnostics. Evaluator invariants are gated by
        # workspace tests; CI success is not an all-profile balance claim.
        run: cargo run -p localexception-playtest --release --locked -- --campaign-survey --survey-seeds 1 --seed 42 --max-seconds 600 --report .agents/playtest/ci-campaign.json

      - name: M19 teaching stress report
        # A standalone earned-kit diagnostic, not an inherited campaign clear.
        run: cargo run -p localexception-playtest --release --locked -- --campaign-survey --survey-mission m19-teaching --survey-seeds 1 --seed 42 --max-seconds 600 --report .agents/playtest/ci-m19-teaching.json

      - name: M19 market stress report
        # Continue the earned prefix; retain failures without an all-clear gate.
        run: cargo run -p localexception-playtest --release --locked -- --campaign-survey --survey-mission m19-market --survey-seeds 1 --seed 42 --max-seconds 600 --report .agents/playtest/ci-m19-market.json

      - name: Team deathmatch and mutator playtests
        run: |
          cargo run -p localexception-playtest --locked -- --agents 4 --rounds 1 --mode tdm --frag-limit 6 --time-limit-seconds 60 --assert --report .agents/playtest/ci-tdm.json
          cargo run -p localexception-playtest --locked -- --agents 4 --rounds 1 --mutator rail-only --frag-limit 3 --time-limit-seconds 45 --assert --report .agents/playtest/ci-rail-only.json
          cargo run -p localexception-playtest --locked -- --agents 4 --rounds 1 --mode tdm --mutator licence-to-kill --frag-limit 6 --time-limit-seconds 60 --assert --report .agents/playtest/ci-tdm-licence.json

      - name: Sector 9 capture the flag socket proof
        run: cargo run -p localexception-playtest --locked -- --ctf-route-smoke --report .agents/playtest/ci-ctf-route.json

      - name: Sector 9 contested playtest
        run: cargo run -p localexception-playtest --locked -- --agents 4 --rounds 1 --mode ctf --map 4 --tiers reflex,planner --capture-limit 1 --time-limit-seconds 180 --max-seconds 240 --assert --ctf-contested --report .agents/playtest/ci-ctf.json

      - name: Sector 9 Sabotage socket proof
        run: cargo run -p localexception-playtest --locked -- --sabotage-route-smoke --report .agents/playtest/ci-sabotage-route.json

      - name: Sector 9 contested Sabotage playtest
        run: cargo run -p localexception-playtest --locked -- --agents 4 --rounds 1 --mode sabotage --map 4 --tiers reflex,planner --time-limit-seconds 105 --max-seconds 160 --assert --sabotage-contested --report .agents/playtest/ci-sabotage.json

      - name: Mixed-client map roster
        run: bash tools/playtest_roster.sh

      - name: Preserve playtest evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playtest-reports
          path: |
            .agents/playtest/ci.json
            .agents/playtest/ci-*.json
            .agents/playtest/roster/*.json
            .agents/playtest/roster/*.log
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

      - name: Check code coverage
        # Bound instrumented setup concurrency while retaining every test and deadline.
        run: cargo llvm-cov --workspace --locked --fail-under-lines 90 -- --test-threads=2

      - name: Build release
        run: cargo build --workspace --release --locked

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build dedicated server image
        run: docker compose build server
      - name: Check runtime identity and legal notices
        run: |
          test "$(docker run --rm --entrypoint id localexception-server:local -u)" = "10001"
          docker run --rm --entrypoint sh localexception-server:local -c 'test -s /usr/share/doc/localexception/localexception-LICENSE.txt && test -s /usr/share/doc/localexception/THIRD_PARTY_LICENSES.txt'
      - name: Start and probe dedicated match
        run: |
          set -euo pipefail
          trap 'docker compose down' EXIT
          docker compose up -d --no-build
          container_id="$(docker compose ps -q server)"
          test -n "$container_id"
          for attempt in {1..45}; do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = healthy ]; then
              break
            fi
            sleep 2
          done
          if [ "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" != healthy ]; then
            docker compose ps
            docker compose logs --no-color server
            exit 1
          fi
          host_ready=false
          for attempt in {1..15}; do
            if response="$(curl --fail --silent --show-error --max-time 3 http://127.0.0.1:6767/status 2>&1)" \
              && grep -q '"kind":"arena"' <<<"$response" \
              && grep -q '"health":{"status":"ok"' <<<"$response"; then
              host_ready=true
              break
            fi
            sleep 2
          done
          if [ "$host_ready" != true ]; then
            printf 'host /status did not become ready: %s\n' "$response" >&2
            docker compose ps
            docker compose logs --no-color server
            exit 1
          fi

  portability:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            asset: Godot_v4.7.2-stable_win64.exe.zip
            binary: Godot_v4.7.2-stable_win64_console.exe
          - os: macos-26
            asset: Godot_v4.7.2-stable_macos.universal.zip
            binary: Godot.app/Contents/MacOS/Godot
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Workspace tests
        run: cargo test --workspace --locked
      - name: Build owned local server for client lifecycle checks
        run: cargo build -p localexception-server --release --locked
      - name: Download Godot 4.7.2-stable
        shell: pwsh
        env:
          GODOT_ASSET: ${{ matrix.asset }}
        run: |
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/4.7.2-stable/$env:GODOT_ASSET" -OutFile godot.zip
      - name: Verify the Godot archive against the committed pin
        shell: bash
        env:
          GODOT_ASSET: ${{ matrix.asset }}
        run: bash tools/check_godot_archive.sh godot.zip "$GODOT_ASSET"
      - name: Unpack Godot
        shell: pwsh
        run: Expand-Archive godot.zip -DestinationPath godot-bin
      - name: Verify client check failure detection
        timeout-minutes: 10
        shell: bash
        run: bash tools/test_godot_check.sh

      - name: Headless client checks
        timeout-minutes: 35
        shell: bash
        env:
          GODOT_BINARY: ${{ matrix.binary }}
        run: |
          export GODOT_BIN="$PWD/godot-bin/$GODOT_BINARY"
          chmod +x "$GODOT_BIN"
          bash tools/godot_check.sh

      - name: Retain failed client check logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-check-logs-${{ matrix.os }}
          path: .agents/godot-check-*/
          include-hidden-files: true
          if-no-files-found: ignore

  soak:
    # Runs beside the test job, off its critical path. The long soak is local.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the server and the harness
        env:
          LOCALEXCEPTION_BUILD_COMMIT: ${{ github.sha }}
        run: cargo build -p localexception-server -p localexception-playtest --release --locked
      - name: Two minute soak
        run: target/release/localexception-playtest --soak --soak-seconds 120 --soak-sample-seconds 15 --soak-bots 4 --agents 4 --soak-spectators 2 --soak-map-rotate --assert --soak-log .agents/soak/ci.ndjson
      - name: Preserve soak evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soak
          path: .agents/soak/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cargo-deny
        uses: taiki-e/install-action@1215446185352662cec6825af8e979af4006a502 # cargo-deny

      - name: Check action pins and the Godot archive helper
        run: |
          bash tools/check_action_pins.sh
          bash tools/test_action_pins.sh
          bash tools/test_check_godot_archive.sh

      - name: Check licenses, bans, and sources
        run: cargo deny check licenses bans sources

      - name: Check advisories
        # New advisories appear without a code change; report them without blocking merges.
        continue-on-error: true
        run: cargo deny check advisories

  godot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build owned local server for client lifecycle checks
        run: cargo build -p localexception-server --release --locked

      - name: Install Godot 4.7.2-stable
        run: |
          curl -fsSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          bash tools/check_godot_archive.sh godot.zip Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          echo "GODOT_BIN=$PWD/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Headless client checks
        timeout-minutes: 35
        run: bash tools/godot_check.sh

      - name: Saved M01 departure and M02 retry
        run: bash tools/test_m02_carry.sh

      - name: Verify client check failure detection
        run: bash tools/test_godot_check.sh

      - name: Retain failed client check logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-check-logs-linux
          path: .agents/godot-check-*/
          include-hidden-files: true
          if-no-files-found: ignore
